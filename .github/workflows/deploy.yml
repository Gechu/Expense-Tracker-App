name: CI i wdrożenie

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend - typecheck i build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend - import aplikacji
        working-directory: backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          SECRET_KEY: ci
        run: |
          pip install -r requirements.txt
          python -c "from app.main import app"

  deploy:
    needs: check
    # Tylko push do main (nie PR-y, w tym z forków - to publiczne repo)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dołącz do sieci Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Wdróż przez SSH
        env:
          # Klucz zakodowany w base64 (jedna linia) - omija problemy z końcówkami
          # linii i zawijaniem przy kopiowaniu klucza z terminala
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "Sekret DEPLOY_SSH_KEY_B64 ma niepoprawny format klucza"; exit 1; }
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            gechu@100.125.238.101 'cd ~/expense-app && ./deploy.sh'
