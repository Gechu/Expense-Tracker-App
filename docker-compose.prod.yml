name: ledger

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: expense_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://expense_user:${POSTGRES_PASSWORD}@db:5432/expense_tracker
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Front i API są pod jedną domeną, więc CORS nie jest używany
      CORS_ORIGINS: ""

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Tylko localhost - na świat wystawia to `tailscale serve`
      - "127.0.0.1:8081:80"

volumes:
  pgdata:
